name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw clean compile test-compile

      - name: Unit tests # No database service needed - unit tests use Mockito
        run: ./mvnw surefire:test -Dexcludes="**/*IntegrationTest.java"

      - name: Integration tests # No database service needed - integration tests use H2 in-memory
        run: ./mvnw surefire:test -Dincludes="**/*IntegrationTest.java"
