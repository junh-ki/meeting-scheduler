services:
  postgres:
    image: postgres:17
    container_name: meeting-scheduler-db
    environment:
      POSTGRES_DB: meeting_scheduler
      POSTGRES_USER: meeting_scheduler
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: meeting-scheduler-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
